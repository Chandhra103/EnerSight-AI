AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  EnerSight AI - Serverless Energy Anomaly Batch Analyzer
  Environmental sustainability analytics microservice using robust Median/MAD baselines.

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        NODE_OPTIONS: "--enable-source-maps"
        POWERTOOLS_SERVICE_NAME: enersight-anomaly-analyzer
        LOG_LEVEL: INFO

Resources:
  EnerSightAnomalyAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: serverless/handlers/analyze.handler
      Description: Batch analyzes multi-facility electricity consumption readings and returns explainable anomalies.
      Events:
        AnalyzeEnergyApi:
          Type: Api
          Properties:
            Path: /api/v1/analyze
            Method: post
        CorsPreflightApi:
          Type: Api
          Properties:
            Path: /api/v1/analyze
            Method: options

Outputs:
  EnerSightApiEndpoint:
    Description: "API Gateway endpoint URL for local or deployed Anomaly Analyzer"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api/v1/analyze"
  EnerSightFunctionArn:
    Description: "EnerSight Anomaly Analyzer Function ARN"
    Value: !GetAtt EnerSightAnomalyAnalyzerFunction.Arn
